services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hyosync
      POSTGRES_PASSWORD: hyosync
      POSTGRES_DB: hyosync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyosync -d hyosync"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
